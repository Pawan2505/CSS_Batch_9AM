    <!-- 
    
    Introduction Of Media Query :
    Use Of Media & Device Size (Desktop, Mini Laptop, Tablet, Mobile Landscape, Mobile Portrait) Xxl, Xl, Lg, Md, Sm, Xs Viewport Meta Tag

    what is Media Query ?
    Media query is a CSS technique introduced in CSS3. It is used to apply different styles.
    for different devices or screen sizes. 
    Media queries are a key component of responsive web design, allowing web pages to adapt their layout and appearance based on the characteristics of the device being used to view them.

    Size of Device/Viewport :
    1. Extra Extra Large Devices (xxl) : 1400px and above
    ex : Large desktop monitors or television screens
    2. Extra Large Devices (xl) : 1200px to 1399px
    ex : Standard desktop monitors or large laptops
    3. Large Devices (lg) : 992px to 1199px
    ex : Small laptops or large tablets in landscape mode
    4. Medium Devices (md) : 768px to 991px
    ex : Tablets in portrait mode or small laptops
    5. Small Devices (sm) : 576px to 767px
    ex : Large smartphones in landscape mode or small tablets or phones
    6. Extra Small Devices (xs) : up to 575px
    ex :smart watch

    What is importantance of meta viewport tag in media queries?
    The meta viewport tag is crucial for responsive web design as it helps control the layout on mobile browsers. By setting the viewport width to the device width and initial scale to 1, it ensures that the webpage is displayed correctly on different screen sizes, allowing media queries to function as intended.

    syntax of Media Query :
    @media (min-width: 1200px) {
        /* CSS rules for devices with a minimum width of 1200px */
    }
