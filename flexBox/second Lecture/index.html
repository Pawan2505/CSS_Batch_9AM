    <!-- 
    
    Display Flex (Parent Property)Justify-Content (Flex-Start, Flex-End, Center, Space-Between, Space-Around, Space-Evenly)Align-Items (Stretch, Center, Flex-Start, Flex-End, Baseline)Align-Content (Stretch, Center, Flex-Start, Flex-End, Space-Between, Space-Around, Space-Evenly)
    -->

    <!-- 
    what is Justify-Content?

    -Justify-Content is used to align the items horizontally(main-axis) in the container.
    
    - when we used flex direction column then Justify-Content will work vertically (cross-axis).

    Values of Justify-Content:

    1. Flex-Start (default): Items are packed toward the start of the flex-direction.

    2. Flex-End: Items are packed toward the end of the flex-direction.

    3. Center: Items are centered along the line.

    4. Space-Between: Items are evenly distributed in the line; first item is on the start line, last item on the end line.

    5. Space-Around: Items are evenly distributed in the line with equal space around them. start and end element gets half-size space on each end.

    6. Space-Evenly: Items are distributed so that the spacing between any two items (and the space to the edges) is equal.


    what is Align-Items?

    -Align-Items is used to align the items vertically(cross-axis) in the container.

    - when we used flex direction column then Align-Items will work horizontally (main-axis).

    Values of Align-Items:

    1. Stretch (default): Items are stretched to fill the container.

    2. Center: Items are centered in the container.

    3. Flex-Start: Items are aligned toward the start of the cross-axis.

    4. Flex-End: Items are aligned toward the end of the cross-axis.

    5. Baseline: Items are aligned such as their baselines align.

    6. space-between: Items are evenly distributed in the cross-axis; first item is on the start line, last item on the end line.

    7. space-around: Items are evenly distributed in the cross-axis with equal space around them. start and end element gets half-size space on each end.

    8. space-evenly: Items are distributed so that the spacing between any two items (and the space to the edges) is equal.

    what is Align-Content?

    -Align-Content is used to align the rows of items when there is extra space in the cross-axis.

    - when we used flex direction column then Align-Content will work in main-axis.

    Values of Align-Content:

    1. Stretch (default): Lines stretch to take up the remaining space.

    2. Center: Lines are packed toward the center of the container.

    3. Flex-Start: Lines are packed toward the start of the container.

    4. Flex-End: Lines are packed toward the end of the container.

    5. Space-Between: Lines are evenly distributed in the container; first line is on the start line, last line on the end line.

    6. Space-Around: Lines are evenly distributed in the container with equal space around them. start and end line gets half-size space on each end.

    7. Space-Evenly: Lines are distributed so that the spacing between any two lines (and the space to the edges) is equal.

    -->
