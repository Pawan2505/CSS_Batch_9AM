<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
    	
    Display Flex (Child Property)
    Flex-Basis : it is used to set the initial main size of a flex item.

    Flex-Grow : it is used to specify how much a flex item will grow relative to the rest of the flex items inside the same container.

    Flex-Shrink : it is used to specify how much a flex item will shrink relative to the rest of the flex items inside the same container. 
 
    Order : it is used to specify the order of the flex items inside the flex container.


    Align-Self (Stretch, Center, Flex-Start, Flex-End, Baseline)

    align-self baseline : The item is aligned such as its baseline aligns with the baseline of the parent.
    example : if the text inside the item is larger than the text inside the other items, the baselines will align.
    <style>
        .box2{
            align-self: baseline;
            font-size: 30px;
        }
    
    -->

    <div class="container">
        <div class="box box1">Box1</div>
        <div class="box box2">Box2</div>
        <div class="box box3">Box3</div>
        <div class="box box4">Box4</div>
        <div class="box box5">Box5</div>
    </div>
    
</body>
</html>
